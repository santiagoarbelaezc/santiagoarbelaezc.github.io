  <!-- Native Mobile PWA Interceptors (No-Zoom & Standalone Navigation) -->
  <script>
    // 1. Prevent Pinch-to-Zoom gestures on iOS Safari / Chrome
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, false);
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, false);
    document.addEventListener('gestureend', function (e) { e.preventDefault(); }, false);

    // 2. Prevent Double-Tap Zoom
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      var now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        var tag = event.target ? event.target.tagName : '';
        if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
          event.preventDefault();
        }
      }
      lastTouchEnd = now;
    }, false);

    // 3. iOS PWA Standalone Internal Navigation Interceptor
    if (('standalone' in window.navigator) && window.navigator.standalone) {
      document.addEventListener('click', function(e) {
        var target = e.target;
        while (target && target.tagName !== 'A') {
          target = target.parentElement;
        }
        if (target && target.hasAttribute('href')) {
          var href = target.getAttribute('href');
          if (href && !href.startsWith('http') && !href.startsWith('//') && !href.startsWith('tel:') && !href.startsWith('mailto:') && !href.startsWith('https://wa.me')) {
            e.preventDefault();
            window.location.href = href;
          }
        }
      }, false);
    }

    // 4. Default Theme Initialization (Always Light Theme for Public App)
    (function() {
      localStorage.setItem('portfolio-theme', 'light');
      document.documentElement.classList.remove('theme-dark', 'theme-red');
      document.documentElement.classList.add('theme-light');
    })();
  </script>
